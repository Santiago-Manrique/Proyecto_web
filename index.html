<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logbook Movimientos | Gestión de Flota</title>
    <!-- Perfil de ingeniería con tipografía Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-blobs"></div>
    
    <div class="glass-shell">
        <aside class="sidebar">
            <h2 class="logo">LOGBOOK<span>PRO</span></h2>
            <nav>
                <button onclick="showTab('movimiento')" class="nav-btn active">Movimientos</button>
                <button onclick="showTab('vehiculos')" class="nav-btn">Mi Flota</button>
                <button onclick="showTab('mantenimiento')" class="nav-btn">Mantenimiento</button>
            </nav>
            <!-- Selector de Contexto Visual -->
            <div class="context-indicator">
                <small>Operando sobre:</small>
                <p id="current-vehicle-name">Ninguno seleccionado</p>
            </div>
        </aside>

        <main class="content">
            <!-- SECCIÓN: CONTROL DE MOVIMIENTOS[cite: 1] -->
            <section id="movimiento" class="tab-content active">
                <header>
                    <h1>Control de Movimientos</h1>
                    <p>Registro automatizado de tiempos de uso y logística[cite: 1]</p>
                </header>
                
                <div class="glass-form">
                    <select id="mov-tipo" class="glass-input">
                        <option value="Salida">Registrar Salida</option>
                        <option value="Entrada">Registrar Entrada</option>
                    </select>
                    <button class="action-btn" id="btn-registrar" onclick="registrarMovimiento()">Confirmar Evento</button>
                </div>

                <div class="table-wrapper">
                    <table id="tabla-movimientos">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Evento</th>
                                <th>Duración del Viaje</th>
                                <th>Responsable</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- SECCIÓN: MI FLOTA (Cards Compactas)[cite: 1] -->
            <section id="vehiculos" class="tab-content">
                <div class="section-header">
                    <h2>Gestión de Unidades</h2>
                    <button class="action-btn" onclick="abrirModalVehiculo()">+ Nuevo Vehículo</button>
                </div>
                <div id="grid-vehiculos" class="vehicle-grid"></div>
            </section>

            <!-- SECCIÓN: MANTENIMIENTO[cite: 1] -->
            <section id="mantenimiento" class="tab-content">
                <h2>Historial Técnico</h2>
                <div class="glass-form">
                    <input type="text" id="mant-desc" placeholder="Descripción del servicio">
                    <select id="mant-tipo">
                        <option value="Falla">Falla Técnica</option>
                        <option value="Service">Service</option>
                    </select>
                    <button class="action-btn" onclick="registrarMantenimiento()">Cargar</button>
                </div>
                <div class="table-wrapper">
                    <table id="tabla-mantenimiento">
                        <thead>
                            <tr><th>Fecha</th><th>Evento</th><th>Tipo</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL DE REGISTRO DE VEHÍCULO[cite: 1] -->
    <div id="modal-vehiculo" class="modal">
        <div class="glass-card modal-content">
            <h3>Alta de Unidad</h3>
            <div class="grid-inputs">
                <input type="text" id="v-marca" placeholder="Marca">
                <input type="text" id="v-modelo" placeholder="Modelo">
                <input type="text" id="v-patente" placeholder="Patente">
                <input type="text" id="v-chasis" placeholder="Chasis">
                <input type="text" id="v-dueno" placeholder="Responsable Asignado">
                <select id="v-estado">
                    <option value="activo">Activo (Verde)</option>
                    <option value="inactivo">Inactivo (Rojo)</option>
                    <option value="mantenimiento">Mantenimiento (Amarillo)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="nav-btn" onclick="cerrarModal()">Cancelar</button>
                <button class="action-btn" onclick="guardarVehiculo()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
