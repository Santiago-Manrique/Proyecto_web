<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VehicleLog PRO | Ingeniería</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <h2>LOGBOOK <span>PRO</span></h2>
        </div>
        <nav>
            <a href="#" class="tab-link active" data-target="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="#" class="tab-link" data-target="vehiculos"><i class="fa-solid fa-motorcycle"></i> Mis Vehículos</a>
            <a href="#" class="tab-link" data-target="consumo"><i class="fa-solid fa-gas-pump"></i> Carga de Nafta</a>
            <a href="#" class="tab-link" data-target="mantenimiento"><i class="fa-solid fa-wrench"></i> Mantenimiento</a>
            <a href="#" class="tab-link" data-target="visualizacion"><i class="fa-solid fa-list"></i> Historial</a>
        </nav>
    </aside>

    <main class="main-content">
        <section id="dashboard" class="tab-content active">
            <header class="content-header">
                <h1>Panel de Resumen</h1>
                <p>Información clave de tu flota individual.</p>
            </header>
            <div class="kpi-grid">
                <div class="card kpi">
                    <span class="label">Vehículos</span>
                    <h3 id="kpi-vehiculos">0</h3>
                </div>
                <div class="card kpi">
                    <span class="label">Último Consumo</span>
                    <h3 id="kpi-eficiencia">0.00 km/l</h3>
                </div>
                <div class="card kpi">
                    <span class="label">Registros Totales</span>
                    <h3 id="kpi-registros">0</h3>
                </div>
            </div>
        </section>

        <section id="vehiculos" class="tab-content">
            <div class="card form-container">
                <h2>Registrar Nuevo Vehículo</h2>
                <form id="form-vehiculo">
                    <div class="input-group">
                        <label>Modelo</label>
                        <input type="text" id="modelo" placeholder="Ej: Bajaj Rouser NS 125" required>
                    </div>
                    <div class="input-group">
                        <label>Patente</label>
                        <input type="text" id="patente" placeholder="Dominio" required>
                    </div>
                    <div class="input-group">
                        <label>Conductor</label>
                        <input type="text" id="conductor" placeholder="Nombre completo" required>
                    </div>
                    <button type="submit" class="btn-primary">Registrar</button>
                </form>
            </div>
        </section>

        <section id="consumo" class="tab-content">
            <div class="card form-container">
                <h2>Carga de Combustible</h2>
                <form id="form-consumo">
                    <div class="input-group">
                        <label>Vehículo</label>
                        <select id="select-vehiculo-consumo" required></select>
                    </div>
                    <div class="input-group">
                        <label>Kilometraje Actual</label>
                        <input type="number" id="km-actual" required>
                    </div>
                    <div class="input-group">
                        <label>Litros Cargados</label>
                        <input type="number" step="0.01" id="litros" required>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Carga</button>
                </form>
            </div>
        </section>

        <section id="mantenimiento" class="tab-content">
            <div class="card form-container">
                <h2>Reportar Falla o Arreglo</h2>
                <form id="form-mantenimiento">
                    <div class="input-group">
                        <label>Vehículo</label>
                        <select id="select-vehiculo-falla" required></select>
                    </div>
                    <div class="input-group">
                        <label>Tipo</label>
                        <select id="tipo-evento">
                            <option value="falla">Falla Técnica</option>
                            <option value="arreglo">Arreglo / Service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Descripción</label>
                        <textarea id="descripcion" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Registrar Evento</button>
                </form>
            </div>
        </section>

        <section id="visualizacion" class="tab-content">
            <div class="card table-card">
                <h2>Historial de Movimientos</h2>
                <div id="contenedor-datos" class="table-responsive"></div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
